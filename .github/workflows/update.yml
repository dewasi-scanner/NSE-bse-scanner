name: Update screener data

on:
  schedule:
    - cron: "30 14 * * 1-5"   # 8:00 PM India time, Mon-Fri
  workflow_dispatch:           # manual "Run workflow" button

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Restore cache
        uses: actions/cache/restore@v4
        with:
          path: |
            cache_close.pkl
            cache_volume.pkl
            shares_cache.json
            sector_cache.json
          key: data-${{ github.run_id }}
          restore-keys: data-

      - name: Run scanner
        run: |
          python export_all.py
          mkdir -p docs
          mv screener_data.json docs/screener_data.json

      - name: Save cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            cache_close.pkl
            cache_volume.pkl
            shares_cache.json
            sector_cache.json
          key: data-${{ github.run_id }}

      - name: Commit data
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add docs/screener_data.json
          git commit -m "Update data" || echo "No changes"
          git pull --rebase origin main
          git push
