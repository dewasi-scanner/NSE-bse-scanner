<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NSE + BSE Screener</title>
<style>
:root{--bg:#fff;--fg:#1a1a1a;--mut:#666;--card:#f4f4f2;--bd:#d9d9d4;--ac:#0f766e;--ok:#15803d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151515;--fg:#ececec;--mut:#9a9a9a;--card:#222;--bd:#383838;--ac:#2dd4bf;--ok:#4ade80}}
:root[data-theme="dark"]{--bg:#151515;--fg:#ececec;--mut:#9a9a9a;--card:#222;--bd:#383838;--ac:#2dd4bf;--ok:#4ade80}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;margin:0;padding:14px}
h1{font-size:18px;margin:0 0 4px}
.mut{color:var(--mut);font-size:13px}
.bar{display:flex;flex-wrap:wrap;gap:10px;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;margin:12px 0}
.bar label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mut)}
.bar input,.bar select{width:96px;padding:6px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--fg);font-size:14px}
.bar .chk{flex-direction:row;align-items:center;gap:6px;color:var(--fg);font-size:14px}
.bar .chk input{width:auto}
button,.btn{background:var(--ac);color:var(--bg);border:0;border-radius:6px;padding:7px 12px;font-size:13px;cursor:pointer}
.btn.alt,button.alt{background:var(--card);color:var(--fg);border:1px solid var(--bd)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
.wrap{overflow-x:auto;border:1px solid var(--bd);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{padding:7px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--bd)}
th:first-child,td:first-child,th:nth-child(2),td:nth-child(2){text-align:left}
th{background:var(--card);cursor:pointer;font-size:12px;position:sticky;top:0}
td.g{color:var(--ok)}
th:nth-child(9),td:nth-child(9),th:nth-child(10),td:nth-child(10){text-align:left}
textarea{width:100%;height:70px;background:var(--card);color:var(--fg);border:1px solid var(--bd);border-radius:6px;padding:6px;box-sizing:border-box}
#empty{padding:24px;text-align:center}
[hidden]{display:none!important}
</style>
</head>
<body>
<h1>NSE + BSE Screener</h1>
<div class="mut" id="info">Abhi koi data nahi hai.</div>

<div class="row">
  <label class="btn" for="file">Data file chuno (screener_data.json)</label>
  <input type="file" id="file" accept=".json,application/json" hidden>
</div>

<div id="main" hidden>
  <div class="bar">
    <label>RS kam se kam<input type="number" id="f_rs" value="90"></label>
    <label>Turnover (cr)<input type="number" id="f_t" value="10"></label>
    <label>Market cap (cr)<input type="number" id="f_m" value="500"></label>
    <label>Price kam se kam<input type="number" id="f_p" value="10"></label>
    <label>Exchange<select id="f_x"><option value="all">Dono</option><option>NSE</option><option>BSE</option></select></label>
    <label>Symbol dhundho<input type="text" id="f_q" placeholder="jaise TCS"></label>
    <label>Sector<select id="f_s" style="width:150px"><option value="all">Sab</option></select></label>
    <label class="chk"><input type="checkbox" id="f_a" checked> Price 200 DMA ke upar</label>
  </div>
  <div class="row">
    <b id="count"></b>
    <button id="csv" class="alt">CSV export</button>
    <button id="tv" class="alt">TradingView list</button>
  </div>
  <div id="tvbox" hidden><textarea id="tvtext" readonly></textarea></div>
  <div class="wrap"><table><thead><tr id="head"></tr></thead><tbody id="body"></tbody></table></div>
  <div id="empty" class="mut" hidden>Is filter se koi stock nahi mila.</div>
</div>

<script>
const $ = id => document.getElementById(id);
const COLS = [["s","Symbol"],["x","Exch"],["m","Mkt cap (cr)"],["p","Price"],["r","RS"],["r3","RS 3M"],["h","52W high se %"],["t","Turnover (cr)"],["sec","Sector"],["ind","Industry"]];
let DATA = null, sortKey = "r", sortDir = -1, DL = null;

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function fmt(v){ return v == null ? "-" : Number(v).toLocaleString("en-IN"); }

function load(o){
  DATA = o;
  $("info").textContent = "Data ki date: " + o.date + "  |  Total stocks: " + o.rows.length;
  const secs = [...new Set(o.rows.map(r => r.sec).filter(Boolean))].sort();
  $("f_s").innerHTML = '<option value="all">Sab</option>' + secs.map(s => "<option>" + esc(s) + "</option>").join("");
  $("main").hidden = false;
  render();
}

function filtered(){
  const n = id => parseFloat($(id).value) || 0;
  const rs = n("f_rs"), t = n("f_t"), m = n("f_m"), p = n("f_p");
  const ex = $("f_x").value, q = $("f_q").value.trim().toLowerCase(), a = $("f_a").checked, sc = $("f_s").value;
  const rows = DATA.rows.filter(r =>
    (r.r ?? 0) >= rs && (r.t ?? 0) >= t && (r.m ?? 0) >= m && (r.p ?? 0) >= p &&
    (!a || r.a) && (ex === "all" || r.x === ex) && (sc === "all" || r.sec === sc) && (!q || r.s.toLowerCase().includes(q)));
  rows.sort((u, v) => {
    const x = u[sortKey], y = v[sortKey];
    if (x == null) return 1;
    if (y == null) return -1;
    return (x < y ? -1 : x > y ? 1 : 0) * sortDir;
  });
  return rows;
}

function render(){
  if (!DATA) return;
  $("head").innerHTML = COLS.map(c => "<th data-k='" + c[0] + "'>" + c[1] + (c[0] === sortKey ? (sortDir < 0 ? " ▼" : " ▲") : "") + "</th>").join("");
  const rows = filtered();
  $("count").textContent = rows.length + " results";
  $("empty").hidden = rows.length > 0;
  $("body").innerHTML = rows.slice(0, 1000).map(r =>
    "<tr><td>" + esc(r.s) + "</td><td>" + r.x + "</td><td>" + fmt(r.m) + "</td><td>" + fmt(r.p) +
    "</td><td class='g'>" + fmt(r.r) + "</td><td>" + fmt(r.r3) + "</td><td>" + fmt(r.h) + "</td><td>" + fmt(r.t) + "</td><td>" + esc(r.sec ?? "-") + "</td><td>" + esc(r.ind ?? "-") + "</td></tr>").join("");
}

$("head").addEventListener("click", e => {
  const k = e.target.dataset.k;
  if (!k) return;
  sortDir = (k === sortKey) ? -sortDir : -1;
  sortKey = k;
  render();
});
document.querySelectorAll(".bar input,.bar select").forEach(el => el.addEventListener("input", render));

$("file").addEventListener("change", e => {
  const f = e.target.files[0];
  if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const o = JSON.parse(rd.result);
      if (!o.rows) throw new Error("bad");
      load(o);
      try { localStorage.setItem("screener_data", rd.result); } catch (err) {}
    } catch (err) {
      $("info").textContent = "File sahi nahi lagi. screener_data.json hi chuno.";
    }
  };
  rd.readAsText(f);
});

$("csv").addEventListener("click", async () => {
  const rows = filtered();
  const head = COLS.map(c => c[1]).join(",");
  const lines = rows.map(r => COLS.map(c => { const v = r[c[0]] ?? ""; return typeof v === "string" ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(","));
  const csv = head + "\n" + lines.join("\n");
  try {
    if (DL) { await DL.save({ filename: "screener_result.csv", data: csv }); }
    else {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
      a.download = "screener_result.csv";
      a.click();
    }
  } catch (err) {}
});

$("tv").addEventListener("click", async () => {
  const text = filtered().map(r => r.x + ":" + r.s).join(",");
  $("tvtext").value = text;
  $("tvbox").hidden = false;
  $("tvtext").select();
  try { await navigator.clipboard.writeText(text); } catch (err) {}
});

(async () => {
  try {
    const r = await fetch("screener_data.json?t=" + Date.now());
    if (r.ok) { load(await r.json()); return; }
  } catch (err) {}
  try { const s = localStorage.getItem("screener_data"); if (s) load(JSON.parse(s)); } catch (err) {}
})();
(async () => {
  try { DL = await claude.use("downloads"); } catch (err) {}
})();
</script>
</body>
</html>
